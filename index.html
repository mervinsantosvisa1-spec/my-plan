<!doctype html>
<html>
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#07100c">

<!-- PWA -->
<link rel="manifest" href="manifest.json?v=3">

<!-- Baki iPhone / iPad Home Screen Icon -->
<link rel="apple-touch-icon" href="baki-app-icon.png?v=3">
<link
  rel="apple-touch-icon"
  sizes="512x512"
  href="baki-app-icon.png?v=3"
>

<title>My Plan</title>

<style>
:root {
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050807;
  color: #f4f7f5;
}

.app {
  max-width: 620px;
  margin: auto;
  min-height: 100vh;
  padding: 22px 16px 40px;
}

h1 {
  font-size: 36px;
  margin: 12px 0 4px;
}

.sub {
  color: #9ba7a0;
  margin-bottom: 22px;
}

/* DAY CARDS */

.day {
  width: 100%;
  text-align: left;
  background: #101714;
  border: 1px solid #26332c;
  color: #fff;
  border-radius: 16px;
  padding: 18px;
  margin: 9px 0;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 18px;
}

.day.a {
  border-color: #2e7eea;
  background: #0d2038;
}

.day.b {
  border-color: #168c55;
  background: #0c2a1c;
}

.day.rest {
  background: #141817;
}

.dow {
  font-weight: 800;
  width: 52px;
}

.plan {
  flex: 1;
}

.plan small {
  display: block;
  color: #aeb9b3;
  margin-top: 3px;
}

.count {
  color: #c8d0cc;
}

.hidden {
  display: none;
}

/* TOP BAR */

.top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 16px;
}

.back {
  border: 0;
  background: none;
  color: #fff;
  font-size: 32px;
  padding: 0;
  cursor: pointer;
}

.top h2 {
  margin: 0;
  font-size: 27px;
}

.tag {
  font-size: 15px;
  margin: -8px 0 15px;
}

.tag.a {
  color: #55a2ff;
}

.tag.b {
  color: #46d88d;
}

/* CHECKLIST */

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #111816;
  border: 1px solid #202a25;
  border-radius: 11px;
  padding: 12px 13px;
  margin: 6px 0;
  cursor: pointer;
}

.item input {
  appearance: none;
  width: 24px;
  height: 24px;
  border: 2px solid #75817b;
  border-radius: 6px;
  margin: 0;
  flex: none;
}

.item input:checked {
  background: #36d17f;
  border-color: #36d17f;
  position: relative;
}

.item input:checked:after {
  content: "✓";
  display: block;
  text-align: center;
  color: #052112;
  font-weight: 900;
  line-height: 20px;
}

.item.done span {
  text-decoration: line-through;
  color: #738078;
}

.icon {
  width: 27px;
  text-align: center;
}

.txt {
  font-size: 16px;
}

/* PROGRESS */

.progress {
  height: 7px;
  background: #1b2520;
  border-radius: 10px;
  overflow: hidden;
  margin: 8px 0 18px;
}

.bar {
  height: 100%;
  background: #35d17f;
  width: 0;
}

/* MEALS / MEDS DETAILS */

.meal-details {
  display: block;
  color: #9eaaa4;
  font-size: 13px;
  line-height: 1.45;
  margin-top: 5px;
}

/* REST DAY */

.restbox {
  text-align: center;
  background: #101714;
  border-radius: 18px;
  padding: 50px 20px;
  margin-top: 40px;
}

/* RESET */

.reset {
  margin-top: 28px;
  width: 100%;
  padding: 13px;
  border: 1px solid #38433e;
  background: #111613;
  color: #aeb7b2;
  border-radius: 12px;
}

footer {
  color: #647069;
  font-size: 12px;
  text-align: center;
  margin-top: 24px;
}
</style>

</head>

<body>

<div class="app">

<section id="home">

  <h1>My Plan</h1>

  <div class="sub">
    One day at a time.
  </div>

  <div id="days"></div>

  <button class="reset" id="reset">
    Reset this week
  </button>

  <footer>
    Your checks are saved on this device.
  </footer>

</section>


<section id="detail" class="hidden">

  <div class="top">

    <button class="back" id="back">
      ‹
    </button>

    <div>
      <h2 id="title"></h2>
      <div id="tag" class="tag"></div>
    </div>

  </div>

  <div id="score"></div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div id="list"></div>

</section>

</div>


<script>

/* ==========================
   MEALS
========================== */

const meal1 = `
<b>Meal 1 (12pm)</b>
<small class="meal-details">
200g Chicken breast ·
200g potatoes ·
50g cottage cheese
</small>
`;

const meal2 = `
<b>Meal 2</b>
<small class="meal-details">
125g Barramundi ·
200g sweet potatoes ·
50g cottage cheese
</small>
`;

const meal3 = `
<b>Meal 3 / Dessert (12am)</b>
<small class="meal-details">
150g Greek yoghurt ·
1 scoop whey protein ·
10g psyllium husk ·
10g chia seeds ·
strawberry / pear
</small>
`;


/* ==========================
   BASIC ITEMS
========================== */

const W = "💧|500ml water";

const S = "👟|10,000 steps";


/* ==========================
   MEDS / VITAMINS
========================== */

const MEDS = `
💊|<b>Meds / Vitamins</b>
<small class="meal-details">
Fish Oil ·
Vitamin D3 ·
Magnesium ·
Finasteride ·
Allopurinol ·
Vitamin B2
</small>
`;


/* ==========================
   PLAN A
   MON / WED / FRI
========================== */

const A = [

  W,

  "🏋️|Incline bench press",
  "🏋️|Incline dumbbell press",
  "🏋️|Dumbbell shoulder press",
  "🏋️|Lateral raises",
  "🏋️|Dumbbell curls",

  W,

  "🍴|" + meal1,

  MEDS,

  W,

  "🍴|" + meal2,

  W,

  "🏋️|Tricep extension",
  "🏋️|Machine fly",
  "🏋️|Dips",
  "🏋️|Flat bench press",

  W,

  "🏋️|Incline dumbbell press",
  "🏋️|Cable lateral raises",
  "🏋️|Decline sit ups",
  "🏋️|Leg raises",

  W,

  "🍴|" + meal3,

  W,

  S
];


/* ==========================
   PLAN B
   TUE / THU / SAT
========================== */

const B = [

  W,

  "🏋️|Dumbbell RDLs",
  "🏋️|Goblet Squats",
  "🏋️|Dumbbell Lunges",
  "🏋️|Calves exercise",

  W,

  "🍴|" + meal1,

  MEDS,

  W,

  "🍴|" + meal2,

  W,

  "🏋️|Assisted pull ups",
  "🏋️|Lat pull downs",
  "🏋️|Close grip rows",
  "🏋️|Wide grip rows",

  W,

  "🏋️|Leg extension",
  "🏋️|Machine squats",
  "🏋️|Hamstring machine exercise",
  "🏋️|Light barbell squats",
  "🏋️|Barbell RDLs",

  W,

  "🍴|" + meal3,

  W,

  S
];


/* ==========================
   WEEK
========================== */

const plans = {

  Monday: [
    "a",
    "Plan A",
    "Upper Body",
    A
  ],

  Tuesday: [
    "b",
    "Plan B",
    "Legs & Back",
    B
  ],

  Wednesday: [
    "a",
    "Plan A",
    "Upper Body",
    A
  ],

  Thursday: [
    "b",
    "Plan B",
    "Legs & Back",
    B
  ],

  Friday: [
    "a",
    "Plan A",
    "Upper Body",
    A
  ],

  Saturday: [
    "b",
    "Plan B",
    "Legs & Back",
    B
  ],

  Sunday: [
    "rest",
    "Rest Day",
    "Recovery",
    [
      MEDS
    ]
  ]
};


/* ==========================
   SAVE DATA
========================== */

const key = "myPlanChecks-v2";

let state = JSON.parse(
  localStorage.getItem(key) || "{}"
);

const save = () => {
  localStorage.setItem(
    key,
    JSON.stringify(state)
  );
};


/* ==========================
   HOME SCREEN
========================== */

function renderHome() {

  let h = "";

  for (const [day, p] of Object.entries(plans)) {

    const total = p[3].length;

    const done =
      (state[day] || [])
      .filter(Boolean)
      .length;

    h += `
      <button
        class="day ${p[0]}"
        data-day="${day}"
      >

        <span class="dow">
          ${day.slice(0,3).toUpperCase()}
        </span>

        <span class="plan">

          <b>${p[1]}</b>

          <small>
            ${p[2] || "Recovery"}
          </small>

        </span>

        <span class="count">
          ${total ? done + "/" + total : "REST"} ›
        </span>

      </button>
    `;
  }

  days.innerHTML = h;

  document
    .querySelectorAll(".day")
    .forEach(x => {

      x.onclick = () =>
        openDay(x.dataset.day);

    });
}


/* ==========================
   OPEN DAY
========================== */

function openDay(day) {

  const p = plans[day];

  home.classList.add("hidden");

  detail.classList.remove("hidden");

  title.textContent = day;

  tag.textContent =
    p[1] +
    (p[2] ? " — " + p[2] : "");

  tag.className =
    "tag " + p[0];


  if (!state[day]) {

    state[day] =
      Array(p[3].length)
      .fill(false);

  }


  list.innerHTML =
    p[3]
    .map((v, i) => {

      let [ic, ...t] =
        v.split("|");

      return `

        <label
          class="item ${
            state[day][i]
            ? "done"
            : ""
          }"
        >

          <input
            type="checkbox"
            data-i="${i}"
            ${
              state[day][i]
              ? "checked"
              : ""
            }
          >

          <span class="icon">
            ${ic}
          </span>

          <span class="txt">
            ${t.join("|")}
          </span>

        </label>
      `;

    })
    .join("");


  list
    .querySelectorAll("input")
    .forEach(c => {

      c.onchange = () => {

        state[day][
          +c.dataset.i
        ] = c.checked;

        save();

        openDay(day);

      };

    });


  update(day);
}


/* ==========================
   PROGRESS
========================== */

function update(day) {

  const p = plans[day];

  const done =
    (state[day] || [])
    .filter(Boolean)
    .length;

  const total =
    p[3].length;

  score.textContent =
    `${done} / ${total} completed`;

  bar.style.width =
    (done / total * 100) + "%";
}


/* ==========================
   BACK BUTTON
========================== */

back.onclick = () => {

  detail.classList.add("hidden");

  home.classList.remove("hidden");

  renderHome();
};


/* ==========================
   RESET WEEK
========================== */

reset.onclick = () => {

  if (
    confirm(
      "Clear all check marks for this week?"
    )
  ) {

    state = {};

    save();

    renderHome();

  }
};


/* ==========================
   START APP
========================== */

renderHome();


/* ==========================
   SERVICE WORKER
========================== */

if ("serviceWorker" in navigator) {

  navigator.serviceWorker
    .register("sw.js");

}

</script>

</body>
</html>
